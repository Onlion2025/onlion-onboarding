<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ONLION Onboarding</title>
<meta name="theme-color" content="#0e0e0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ONLION">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;600&display=swap">
<style>
/* Layout: ONLION-Cockpit – Seitenleiste (Kunden, Ablauf) + Arbeitsfläche; Formular + Live-Dokument nebeneinander */
:root{
  --bg:#0e0e0e; --panel:#161616; --panel2:#1d1d1d; --line:#2a2a2a; --fg:#f2f2f0; --muted:#a8a8a3;
  --lime:#c8ff00; --lime-ink:#0e0e0e; --warn:#ffb347; --ok:#7ee08a;
  --paper:#ffffff; --ink:#1c1c1c; --ink-muted:#5f5b55;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.app{display:flex;flex-wrap:wrap;min-height:100%}
.side{flex:1 1 250px;max-width:280px;background:var(--panel);border-right:1px solid var(--line);padding-block:24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:24px}
.main{flex:999 1 560px;min-width:0;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main-inner{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-inline:clamp(0px,2vw,24px)}
.brand img{width:150px;display:block}
.brand .prod{color:var(--lime);font-weight:600;font-size:15px;margin-top:6px}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.group{display:flex;flex-direction:column;gap:6px}
.navbtn{display:block;width:100%;text-align:left;min-height:44px;padding:10px 12px;border-radius:10px;border:0;background:transparent;color:#d6d6d2;cursor:pointer}
.navbtn:hover{background:var(--panel2)}
.navbtn.on{background:var(--lime);color:var(--lime-ink);font-weight:700}
.navbtn small{display:block;font-size:12px;opacity:.75;font-weight:400}
.step{display:flex;gap:10px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);flex:none}
.dot.done{background:var(--lime);border-color:var(--lime)}
.dot.now{border-color:var(--lime)}
.btn{min-height:46px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;font-weight:500}
.btn:hover{border-color:#4a4a4a}
.btn.primary{background:var(--lime);color:var(--lime-ink);border:0;font-weight:700}
.btn.primary:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost-dashed{border-style:dashed;color:var(--lime);width:100%}
.btn.danger{color:#ff9b8a;border-color:#5a2a24}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
h1{margin:0;font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-size:20px;font-weight:700;text-wrap:balance}
.eyebrow{font-size:13px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600}
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.login-card{width:min(420px,100%)}
input[type=text],input[type=email],input[type=tel],input[type=password],textarea,select{background:var(--bg);border:1px solid #333;border-radius:10px;padding:11px 12px;min-height:44px;width:100%}
textarea{min-height:76px;resize:vertical}
input:disabled,textarea:disabled,select:disabled{opacity:.6}
.check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding-block:6px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--lime);flex:none}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;list-style:none;margin:0;padding:0}
.stage{border-radius:16px;padding:18px;min-height:170px;display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);text-align:left;cursor:pointer;color:var(--fg);width:100%}
.stage:hover{border-color:#4a4a4a}
.stage.done{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.stage.now{border:2px solid var(--lime)}
.stage.locked{opacity:.55;cursor:default}
.stage .k{font-size:12px;font-weight:700;letter-spacing:.06em}
.stage .t{font-size:18px;font-weight:800}
.stage .d{font-size:13px;line-height:1.4}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #333;background:transparent;color:#d6d6d2;cursor:pointer;font-size:13px}
.chip.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime);font-weight:600}
.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.q.star{border-color:#4d5f12}
.q label{font-weight:600}
.star-mark{color:var(--lime)}
.progress{width:180px;height:8px;background:#262626;border-radius:4px;overflow:hidden}
.progress>div{height:100%;background:var(--lime)}
.tabnum{font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:clamp(20px,4vw,44px);font-family:var(--serif);font-size:14px;line-height:1.6;box-shadow:0 4px 24px rgba(0,0,0,.45);max-height:78vh;overflow:auto}
.paper .ph{display:flex;justify-content:space-between;align-items:center;font-family:var(--sans);font-size:11px;color:var(--ink-muted);gap:10px;flex-wrap:wrap}
.paper .ph img{width:90px}
.paper .bar{height:3px;width:48px;background:var(--lime);margin:12px 0}
.paper pre{white-space:pre-wrap;font-family:inherit;margin:0}
.banner{border-radius:12px;padding:12px 16px;font-size:14px;border:1px solid}
.banner.warn{border-color:#6b4a14;background:#211a0d;color:#ffd79a}
.banner.ok{border-color:#2f5f36;background:#0f1d11;color:#b8f2bf}
.banner.info{border-color:#3a3a3a;background:var(--panel2);color:#d6d6d2}
.pad-wrap{display:flex;flex-direction:column;gap:8px}
canvas.pad{width:100%;height:170px;background:#fbfbf8;border-radius:12px;touch-action:none;cursor:crosshair;display:block}
.sigimg{background:#fbfbf8;border-radius:10px;max-width:320px;width:100%}
.empty{border:1px dashed #3a3a3a;border-radius:16px;padding:28px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--lime);color:var(--lime-ink);padding:12px 16px;border-radius:12px;font-weight:600;z-index:20}
.tpl-q{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;color:var(--muted)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#24110e;border:1px solid #5a2a24;border-radius:12px;padding:10px 12px}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}.side{max-width:none;flex-basis:100%;border-right:0;border-bottom:1px solid var(--line)}.paper{max-height:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form class="card login-card" id="loginForm">
    <img src="logo-white.png" alt="ONLION" style="width:170px">
    <div class="eyebrow" style="color:var(--lime);font-weight:600">KI-Telefon-Agent · Onboarding</div>
    <div class="field"><label for="lg-mail">E-Mail</label><input type="email" id="lg-mail" autocomplete="username" required></div>
    <div class="field"><label for="lg-pw">Passwort</label><input type="password" id="lg-pw" autocomplete="current-password" required></div>
    <div id="lg-err" class="banner warn" hidden></div>
    <button class="btn primary" type="submit" id="lg-btn">Anmelden</button>
  </form>
</div>
<div class="app">
  <nav class="side" aria-label="Navigation">
    <div class="brand"><img src="logo-white.png" alt="ONLION"><div class="prod" id="prodName">KI-Telefon-Agent</div></div>
    <div class="group">
      <div class="label">Kunden</div>
      <div id="custList"></div>
      <div id="newCustBox"></div>
    </div>
    <div class="group" id="flowNav" hidden>
      <div class="label">Ablauf</div>
      <div id="flowList"></div>
    </div>
    <div class="group">
      <div class="label">Einstellungen</div>
      <button class="navbtn" id="navTpl" type="button">Vorlagen &amp; Rechtstexte</button>
      <button class="navbtn" id="logoutBtn" type="button">Abmelden</button>
    </div>
  </nav>
  <main class="main"><div class="main-inner" id="view"></div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
const TPL_ID='ki-telefon-agent', LEGAL_ID='ki-telefon-agent';
const STAGES=[
  {id:'fragen',t:'Fragenkatalog'},
  {id:'datenschutz',t:'Datenschutz & AVV'},
  {id:'unterschrift',t:'Unterschrift'},
  {id:'pdf',t:'PDF'},
  {id:'angebot',t:'Angebot & Rechnung'}
];
const STORAGE_OPTS=['Nur als Text, 90 Tage','Audio und Text, 30 Tage','Nicht speichern'];
const S={db:null,dl:null,customers:[],tpl:null,legal:null,curId:null,view:'start',section:0,newOpen:false,loaded:false,pendingRender:false,confirm:null,pads:{}};

function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k]; if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(k==='value')el.value=v;
    else if(k==='checked')el.checked=!!v;
    else if(k==='disabled')el.disabled=!!v;
    else el.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat()){ if(c==null||c===false)continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}
function cur(){return S.customers.find(c=>c.id===S.curId)||null;}
function allQs(){return S.tpl?S.tpl.sections.flatMap(s=>s.questions):[];}
function answeredCount(c){const a=c.answers||{};return allQs().filter(q=>(a[q.id]||'').trim()).length;}
function legalOk(c){const l=c.legal||{};return !!(l.dsb&&l.speicherung&&l.hinweis&&l.agb);}
function signed(c){return !!(c&&c.signature&&c.signature.hash);}
function stageState(c,id){
  const total=allQs().length,n=answeredCount(c);
  if(id==='fragen')return total&&n===total?'done':(n?'now':'open');
  if(id==='datenschutz')return legalOk(c)?'done':((c.legal&&Object.keys(c.legal).length)?'now':'open');
  if(id==='unterschrift')return signed(c)?'done':'open';
  if(id==='pdf')return c.pdfAt?'done':'open';
  return 'locked';
}
function fmtDate(iso){try{return new Date(iso).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'});}catch(e){return iso;}}
function fill(text,c){
  const l=c.legal||{}, today=new Date().toLocaleDateString('de-DE');
  const map={firma:c.firma||'[Firma]',adresse:c.adresse||'[Adresse]',vertreter:c.ansprechpartner||'[Ansprechpartner]',dsb:l.dsb||'[Datenschutzbeauftragter]',speicherung:l.speicherung||'[Speicherung]',datum:today};
  return String(text||'').replace(/\{\{\s*(\w+)\s*\}\}/g,(m,k)=>k in map?map[k]:m);
}

/* ---------- writes ---------- */
const timers={};
function deepMerge(t,p){for(const k in p){const v=p[k];if(v&&typeof v==='object'&&!Array.isArray(v)){if(!t[k]||typeof t[k]!=='object')t[k]={};deepMerge(t[k],v);}else t[k]=v;}return t;}
function saveCust(id,patch,delay){
  if(!S.db)return;
  const top=Object.keys(patch)[0],sub=patch[top]&&typeof patch[top]==='object'?Object.keys(patch[top])[0]:'';
  const key=id+'|'+top+'|'+sub;
  const local=S.customers.find(c=>c.id===id);if(local)deepMerge(local,JSON.parse(JSON.stringify(patch)));
  if(timers[key])clearTimeout(timers[key].t);
  const run=()=>{delete timers[key];return S.db.doc('customers/'+id).update(Object.assign({updatedAt:new Date().toISOString()},patch)).catch(e=>toast('Nicht gespeichert: '+(e&&e.message||e)));};
  timers[key]={t:setTimeout(run,delay==null?500:delay),run};
}
function flushAll(){const ps=[];for(const k in timers){clearTimeout(timers[k].t);ps.push(timers[k].run());}return Promise.all(ps);}
async function createCustomer(data){
  const now=new Date().toISOString();
  const ref=S.db.collection('customers').doc();
  await ref.set(Object.assign({product:'KI-Telefon-Agent',templateId:TPL_ID,answers:{},legal:{},createdAt:now,updatedAt:now},data));
  S.curId=ref.id;S.view='start';S.newOpen=false;render();
}

/* ---------- sidebar ---------- */
function renderSide(){
  const list=document.getElementById('custList');list.replaceChildren();
  if(!S.loaded)list.append(h('div',{class:'eyebrow',text:'Lade Kunden …'}));
  for(const c of S.customers){
    list.append(h('button',{type:'button',class:'navbtn'+(c.id===S.curId&&S.view!=='vorlagen'?' on':''),onclick:()=>{S.curId=c.id;S.view='start';render();}},c.firma||'Ohne Namen',h('small',null,signed(c)?'unterschrieben':(answeredCount(c)+' von '+allQs().length+' Fragen'))));
  }
  const nb=document.getElementById('newCustBox');nb.replaceChildren();
  if(!S.db){nb.append(h('div',{class:'eyebrow',text:'Speichern ist in dieser Ansicht nicht verfügbar.'}));}
  else if(!S.newOpen){nb.append(h('button',{type:'button',class:'btn ghost-dashed',onclick:()=>{S.newOpen=true;renderSide();setTimeout(()=>{const f=document.getElementById('nc-firma');f&&f.focus();},0);}},'+ Neuer Kunde'));}
  else{
    const form=h('form',{class:'card',style:'padding:14px;gap:10px',onsubmit:e=>{e.preventDefault();const v=document.getElementById('nc-firma').value.trim();if(!v){toast('Bitte einen Firmennamen eintragen.');return;}createCustomer({firma:v});}},
      h('div',{class:'field'},h('label',{for:'nc-firma'},'Firma'),h('input',{type:'text',id:'nc-firma',autocomplete:'organization'})),
      h('div',{class:'row'},h('button',{type:'submit',class:'btn primary'},'Anlegen'),h('button',{type:'button',class:'btn',onclick:()=>{S.newOpen=false;renderSide();}},'Abbrechen')));
    nb.append(form);
  }
  const fn=document.getElementById('flowNav'),fl=document.getElementById('flowList'),c=cur();
  fn.hidden=!c||S.view==='vorlagen';fl.replaceChildren();
  if(c&&S.view!=='vorlagen'){
    fl.append(h('button',{type:'button',class:'navbtn'+(S.view==='start'?' on':''),onclick:()=>{S.view='start';render();}},'Übersicht'));
    STAGES.forEach((st,i)=>{
      const state=stageState(c,st.id);
      fl.append(h('button',{type:'button',class:'navbtn'+(S.view===st.id?' on':''),disabled:state==='locked',onclick:()=>{S.view=st.id;render();}},h('span',{class:'step'},h('span',{class:'dot '+(state==='done'?'done':state==='now'?'now':'')}),(i+1)+' · '+st.t)));
    });
  }
  document.getElementById('navTpl').className='navbtn'+(S.view==='vorlagen'?' on':'');
}

/* ---------- views ---------- */
function viewEmpty(){
  return h('div',{class:'empty'},
    h('h1',null,'KI-Telefon-Agent · Kundenaufnahme'),
    h('p',{style:'margin:0;max-width:60ch'},'Hier entstehen deine Kundenakten: Fragenkatalog, Datenschutz, Unterschrift und PDF. Lege links mit „Neuer Kunde“ den ersten Kunden an.'),
    !S.tpl&&S.loaded?h('div',{class:'banner warn'},'Die Vorlage „KI-Telefon-Agent“ fehlt noch. Ohne sie gibt es keine Fragen.'):null);
}
function header(c,title){
  return h('div',{class:'row',style:'align-items:flex-end'},
    h('div',null,h('div',{class:'eyebrow'},c.firma||'Ohne Namen'),h('h1',null,title)),
    h('div',{class:'spacer'}));
}
function lockedBanner(c){return signed(c)?h('div',{class:'banner ok'},'Unterschrieben am '+fmtDate(c.signature.signedAt)+'. Änderungen sind gesperrt. Zum Ändern unter „Unterschrift“ eine neue Version starten.'):null;}

function viewStart(c){
  const stages=h('ol',{class:'stages','aria-label':'Ablauf'});
  STAGES.forEach((st,i)=>{
    const state=stageState(c,st.id);
    let d='';
    if(st.id==='fragen')d=answeredCount(c)+' von '+allQs().length+' Fragen beantwortet';
    if(st.id==='datenschutz')d=legalOk(c)?'Angaben vollständig':'Speicherdauer, Hosting, Ansprechpartner';
    if(st.id==='unterschrift')d=signed(c)?'Am '+fmtDate(c.signature.signedAt):'Direkt auf dem iPad, mit Zeitstempel';
    if(st.id==='pdf')d=c.pdfAt?'Erstellt am '+fmtDate(c.pdfAt):'Zusammenfassung als PDF speichern';
    if(st.id==='angebot')d='Folgt in Stufe 3 über Lexware Office';
    const k=String(i+1).padStart(2,'0')+' · '+(state==='done'?'ERLEDIGT':state==='now'?'IN ARBEIT':state==='locked'?'BALD':'OFFEN');
    stages.append(h('li',null,h('button',{type:'button',class:'stage '+state,disabled:state==='locked',onclick:()=>{S.view=st.id;render();}},h('span',{class:'k'},k),h('span',{class:'t'},st.t),h('span',{class:'d'},d))));
  });
  const ro=signed(c);
  const f=(id,label,key,type)=>h('div',{class:'field'},h('label',{for:id},label),h('input',{type:type||'text',id,value:c[key]||'',disabled:ro,oninput:e=>{const p={};p[key]=e.target.value;saveCust(c.id,p);}}));
  const stamm=h('section',{class:'card','aria-label':'Stammdaten'},h('h2',null,'Stammdaten'),
    h('div',{class:'grid2'},f('s-firma','Firma','firma'),f('s-ap','Ansprechpartner / vertretungsberechtigt','ansprechpartner'),f('s-mail','E-Mail','email','email'),f('s-tel','Telefon','telefon','tel')),
    f('s-adr','Adresse','adresse'));
  const del=S.confirm==='del'+c.id
    ?h('div',{class:'confirm'},'Kundenakte „'+(c.firma||'')+'“ endgültig löschen?',h('button',{type:'button',class:'btn danger',onclick:async()=>{await S.db.doc('customers/'+c.id).delete();S.curId=null;S.confirm=null;S.view='start';toast('Kundenakte gelöscht');render();}},'Ja, löschen'),h('button',{type:'button',class:'btn',onclick:()=>{S.confirm=null;render();}},'Abbrechen'))
    :h('button',{type:'button',class:'btn danger',onclick:()=>{S.confirm='del'+c.id;render();}},'Kundenakte löschen');
  const next=STAGES.find(st=>stageState(c,st.id)!=='done'&&stageState(c,st.id)!=='locked');
  return [
    h('div',{class:'row',style:'align-items:flex-end'},h('div',null,h('div',{class:'eyebrow'},'KI-Telefon-Agent'),h('h1',null,c.firma||'Ohne Namen')),h('div',{class:'spacer'}),
      next?h('button',{type:'button',class:'btn primary',onclick:()=>{S.view=next.id;render();}},'Weiter: '+next.t):null),
    stages,stamm,h('div',{class:'row'},del)];
}

function viewFragen(c){
  if(!S.tpl)return [header(c,'Fragenkatalog'),viewEmpty()];
  const secs=S.tpl.sections, si=Math.min(S.section,secs.length-1), sec=secs[si], a=c.answers||{}, ro=signed(c);
  const total=allQs().length,n=answeredCount(c);
  const chips=h('div',{class:'chips',role:'tablist'});

function makePad(key){
  const cv=h('canvas',{class:'pad','aria-label':'Unterschriftsfeld',role:'img'});
  const st={empty:true};S.pads[key]={cv,st};

  const size=()=>{const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;if(!r.width)return;cv.width=r.width*d;cv.height=r.height*d;ctx=cv.getContext('2d');ctx.scale(d,d);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';st.empty=true;};
  requestAnimationFrame(size);

  cv.addEventListener('pointerdown',e=>{if(!ctx)size();drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(last.x,last.y,1.2,0,Math.PI*2);ctx.fillStyle='#111';ctx.fill();if(st.empty){st.empty=false;checkSign();}});

  const enqueue=(key,fn)=>{const p=(queues.get(key)||Promise.resolve()).then(fn,fn);queues.set(key,p.catch(()=>{}));return p;};
  const snap=(id,d)=>({id,exists:!!d,data:()=>d||undefined});
  async function fetchDoc(col,id){const {data,error}=await sb.from('docs').select('data').eq('collection',col).eq('id',id).maybeSingle();if(error)throw error;return data?data.data:null;}
  async function fetchCol(col){const {data,error}=await sb.from('docs').select('id,data').eq('collection',col);if(error)throw error;return data||[];}
  async function emit(l){
    try{
      if(l.type==='doc'){l.cb(snap(l.id,await fetchDoc(l.col,l.id)));return;}
      const rows=await fetchCol(l.col);
      if(l.order){const [f,dir]=l.order;rows.sort((a,b)=>{const x=a.data[f]||'',y=b.data[f]||'';return (x<y?-1:x>y?1:0)*(dir==='desc'?-1:1);});}
      l.cb({docs:rows.map(r=>snap(r.id,r.data))});
    }catch(e){l.err&&l.err(e);}
  }
  const notify=col=>{for(const l of listeners)if(l.col===col)emit(l);};
  sb.channel('docs-changes').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{const col=(p.new&&p.new.collection)||(p.old&&p.old.collection);if(col)notify(col);else for(const l of listeners)emit(l);}).subscribe();
  async function write(col,id,data){const {error}=await sb.from('docs').upsert({collection:col,id,data,updated_at:new Date().toISOString()});if(error)throw error;}
  function doc(path){
    const [col,id]=path.split('/');const key=col+'/'+id;
    return {id,
      get:async()=>snap(id,await fetchDoc(col,id)),
      set:d=>enqueue(key,async()=>{await write(col,id,d);notify(col);}),
      update:p=>enqueue(key,async()=>{const cur=await fetchDoc(col,id);if(!cur)throw new Error('Datensatz nicht gefunden');await write(col,id,deepMerge(JSON.parse(JSON.stringify(cur)),JSON.parse(JSON.stringify(p))));notify(col);}),
      delete:()=>enqueue(key,async()=>{const {error}=await sb.from('docs').delete().eq('collection',col).eq('id',id);if(error)throw error;notify(col);}),
      onSnapshot(cb,err){const l={type:'doc',col,id,cb,err};listeners.add(l);emit(l);return()=>listeners.delete(l);}
    };
  }
  function collection(col){
    const q={_order:null,
      orderBy(f,dir){q._order=[f,dir||'asc'];return q;},
      doc(id){return doc(col+'/'+(id||crypto.randomUUID()));},
      onSnapshot(cb,err){const l={type:'col',col,cb,err,order:q._order};listeners.add(l);emit(l);return()=>listeners.delete(l);}
    };
    return q;
  }
  return {doc,collection};
}
const browserDownloads={save:async({filename,data})=>{
  const url=URL.createObjectURL(data);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
}};
function loginFlow(sb){
  return new Promise(resolve=>{
    const box=document.getElementById('login'),form=document.getElementById('loginForm'),err=document.getElementById('lg-err'),btn=document.getElementById('lg-btn');
    box.hidden=false;setTimeout(()=>document.getElementById('lg-mail').focus(),50);
    form.addEventListener('submit',async e=>{
      e.preventDefault();err.hidden=true;btn.disabled=true;btn.textContent='Anmelden …';
      const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('lg-mail').value.trim(),password:document.getElementById('lg-pw').value});
      btn.disabled=false;btn.textContent='Anmelden';
      if(error){err.textContent='Anmeldung fehlgeschlagen. E-Mail und Passwort prüfen.';err.hidden=false;return;}
      box.hidden=true;resolve(data.session);
    });
  });
}
function showSetup(){
  document.getElementById('view').replaceChildren(h('div',{class:'empty'},h('h1',null,'Einrichtung fehlt'),h('p',{style:'margin:0;max-width:60ch'},'In der Datei config.js fehlen die Supabase-Adresse und der öffentliche Schlüssel. Schritte stehen in der README.')));
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}

(async function boot(){
  const cfg=window.ONLION_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl||/DEIN-PROJEKT/.test(cfg.supabaseUrl)){S.loaded=true;render();showSetup();return;}
  const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  document.getElementById('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.reload();});
  const {data:{session}}=await sb.auth.getSession();
  if(!session)await loginFlow(sb);
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.reload();});
  const db=makeDb(sb);
  S.db=db;S.dl=browserDownloads;
  db.collection('customers').orderBy('createdAt','desc').onSnapshot(snap=>{
    S.customers=snap.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded=true;
    if(!S.curId&&S.customers.length)S.curId=S.customers[0].id;
    if(S.view==='datenschutz'&&S._drawPreview){S._drawPreview();}
    if(S.view==='unterschrift'&&!signed(cur())){renderSide();return;}
    render();
  },e=>{S.loaded=true;toast('Kunden konnten nicht geladen werden.');render();});
  db.doc('templates/'+TPL_ID).onSnapshot(s=>{
    const a=document.activeElement;if(S.view==='vorlagen'&&a&&a.closest&&a.closest('#view'))return;
    S.tpl=s.exists?JSON.parse(JSON.stringify(s.data())):null;if(S.tpl&&S.tpl.name)document.getElementById('prodName').textContent=S.tpl.product||'KI-Telefon-Agent';
    if(S.view==='unterschrift'&&!signed(cur())){renderSide();return;}render();});
  db.doc('legal/'+LEGAL_ID).onSnapshot(s=>{
    const a=document.activeElement;if(S.view==='vorlagen'&&a&&a.closest&&a.closest('#view'))return;
    S.legal=s.exists?JSON.parse(JSON.stringify(s.data())):null;if(S.view==='datenschutz'&&S._drawPreview)S._drawPreview();else if(S.view==='unterschrift'&&!signed(cur()))renderSide();else render();});
})();
})();
</script>
