<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ONLION Onboarding</title>
<meta name="theme-color" content="#f5f5f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ONLION">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;600&display=swap">
<style>
/* Layout: ONLION-Cockpit – Seitenleiste (Kunden, Ablauf) + Arbeitsfläche; Formular + Live-Dokument nebeneinander */
:root{
  --bg:#f5f5f1; --panel:#ffffff; --panel2:#efefea; --line:#e2e2db; --line-strong:#c9c9c0; --fg:#141414; --muted:#5d5d56;
  --lime:#c8ff00; --lime-ink:#0e0e0e; --accent-ink:#4a6600; --field:#ffffff;
  --paper:#ffffff; --ink:#1c1c1c; --ink-muted:#5f5b55;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.app{display:flex;flex-wrap:wrap;min-height:100%}
.side{flex:1 1 250px;max-width:280px;background:var(--panel);border-right:1px solid var(--line);padding-block:24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:24px}
.main{flex:999 1 560px;min-width:0;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main-inner{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-inline:clamp(0px,2vw,24px)}
.brand{display:block;text-decoration:none;border-radius:10px}
.brand:hover img{opacity:.85}
.brand img{width:150px;display:block}
.brand .prod{color:var(--accent-ink);font-weight:600;font-size:15px;margin-top:6px}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.group{display:flex;flex-direction:column;gap:6px}
.navbtn{display:block;width:100%;text-align:left;min-height:44px;padding:10px 12px;border-radius:10px;border:0;background:transparent;color:var(--fg);cursor:pointer}
.navbtn:hover{background:var(--panel2)}
.navbtn.on{background:var(--lime);color:var(--lime-ink);font-weight:700}
.navbtn small{display:block;font-size:12px;opacity:.75;font-weight:400}
.step{display:flex;gap:10px;align-items:flex-start}
.step .dot{margin-top:5px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);flex:none}
.dot.done{background:var(--lime);border-color:var(--accent-ink)}
.dot.now{border-color:var(--accent-ink)}
.btn{min-height:46px;padding:0 20px;border-radius:12px;border:1px solid var(--line-strong);background:var(--panel);color:var(--fg);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--line-strong);background:var(--panel2)}
.btn.primary{background:var(--lime);color:var(--lime-ink);border:0;font-weight:700}
.btn.primary:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost-dashed{border-style:dashed;color:var(--accent-ink);background:transparent;width:100%}
.btn.danger{color:#b42318;border-color:#f1b8b0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
h1{margin:0;font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-size:20px;font-weight:700;text-wrap:balance}
.eyebrow{font-size:13px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-items:end}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600}
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.login-card{width:min(420px,100%)}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=datetime-local],input[type=month],textarea,select{background:var(--field);border:1px solid var(--line-strong);border-radius:10px;padding:11px 12px;min-height:44px;width:100%}
textarea{min-height:76px;resize:vertical}
input:disabled,textarea:disabled,select:disabled{opacity:.6}
/* iPhone/Safari: Datumsfelder wie alle anderen Felder, nicht breiter als der Rahmen */
input[type=date],input[type=month],input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:1.3}
input[type=date]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value,input[type=datetime-local]::-webkit-date-and-time-value{text-align:left;margin:0}
.field>*{min-width:0;max-width:100%}
.check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding-block:6px}
.bro-edit{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}.bro-edit>summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}.bro-edit[open]>summary{margin-bottom:8px}.bro-edit .field+.field{margin-top:10px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent-ink);flex:none}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;list-style:none;margin:0;padding:0}
.stages>li{display:flex;min-width:0}
.stage{border-radius:16px;padding:16px;min-height:170px;height:100%;display:flex;flex-direction:column;justify-content:flex-start;gap:8px;background:var(--panel);border:1px solid var(--line);text-align:left;cursor:pointer;color:var(--fg);width:100%}
.stage:hover{border-color:var(--line-strong)}
.stage.done{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.stage.now{border-color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-ink)}
.stage.locked{opacity:.72;cursor:default}
.stage .k{font-size:12px;font-weight:700;letter-spacing:.06em}
.stage .t{font-size:17px;font-weight:800;line-height:1.25}
.stage .d{font-size:13px;line-height:1.4}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--panel);color:var(--fg);cursor:pointer;font-size:13px}
.chip.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime);font-weight:600}
.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.q.star{border-color:#b9d36b}
.q label{font-weight:600}
.star-mark{color:var(--accent-ink)}
.progress{width:180px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress>div{height:100%;background:var(--lime)}
.tabnum{font-variant-numeric:tabular-nums}
.offer-rows{display:flex;flex-direction:column;gap:12px}
.offer-row{display:grid;grid-template-columns:minmax(0,3fr) minmax(70px,.7fr) minmax(90px,1fr) minmax(110px,1.1fr) auto;gap:10px;align-items:end;padding-bottom:12px;border-bottom:1px solid var(--line)}
.totals{display:flex;flex-direction:column;gap:6px;margin-left:auto;min-width:240px;font-size:15px}
.totals>div{display:flex;justify-content:space-between;gap:24px}
.totals .sum{font-weight:800;font-size:18px;border-top:1px solid var(--line-strong);padding-top:6px}
.hist{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
@media (max-width:760px){.offer-row{grid-template-columns:repeat(2,minmax(0,1fr))}.offer-row .of-name{grid-column:1/-1}.totals{min-width:0;width:100%}}
.pbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.pbar>div{height:100%;background:var(--lime);border-radius:6px;transition:width .3s}
.prog{gap:14px}
.prog-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.prog-pct{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.prog-parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.part{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);text-align:left;cursor:pointer;min-height:44px;color:var(--fg)}
.part:hover{border-color:var(--line-strong)}
.part .pl{font-size:13px;font-weight:600}.part .pn{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.part .pbar{height:6px}
.prog-mini{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.prog-mini .pbar{flex:1;min-width:120px;max-width:260px;height:6px}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:clamp(20px,4vw,44px);font-family:var(--serif);font-size:14px;line-height:1.6;box-shadow:0 2px 14px rgba(0,0,0,.07);border:1px solid var(--line);max-height:78vh;overflow:auto}
.paper .ph{display:flex;justify-content:space-between;align-items:center;font-family:var(--sans);font-size:11px;color:var(--ink-muted);gap:10px;flex-wrap:wrap}
.paper .ph img{width:90px}
.paper .bar{height:3px;width:48px;background:var(--lime);margin:12px 0}
.paper pre{white-space:pre-wrap;font-family:inherit;margin:0}
.banner{border-radius:12px;padding:12px 16px;font-size:14px;border:1px solid}
.banner.warn{border-color:#f2d39b;background:#fff8eb;color:#7a4b00}
.banner.ok{border-color:#b7e1bd;background:#effaf0;color:#1f5f2a}
.banner.info{border-color:var(--line);background:var(--panel2);color:var(--fg)}
.pad-wrap{display:flex;flex-direction:column;gap:8px}
canvas.pad{width:100%;height:170px;background:#ffffff;border:1px solid var(--line-strong);border-radius:12px;touch-action:none;cursor:crosshair;display:block}
.sigimg{background:#ffffff;border:1px solid var(--line);border-radius:10px;max-width:320px;width:100%}
.empty{border:1px dashed var(--line-strong);border-radius:16px;padding:28px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.toast{position:fixed;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);top:calc(16px + env(safe-area-inset-top,0px));background:var(--lime);color:var(--lime-ink);padding:12px 16px;border-radius:12px;font-weight:600;z-index:20}
.tpl-q{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:1fr;gap:12px}
@media (max-width:1400px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:118px;min-width:0}
.kpi .kn{font-size:clamp(20px,2.2vw,28px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.kpi .kl{font-size:13px;color:var(--muted);font-weight:600;min-height:2.6em}
.kpi .ks{font-size:12px;color:var(--muted)}
.kpi.hl{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}.kpi.hl .kl,.kpi.hl .ks{color:var(--lime-ink)}
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.pst{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;min-height:104px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:var(--fg);min-width:0}
.pst:hover{border-color:var(--line-strong)}.pst.on{box-shadow:inset 0 0 0 2px var(--accent-ink);border-color:var(--accent-ink)}
.pst .pn{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.pst .pl{font-size:13px;font-weight:600;line-height:1.3}
@media (max-width:1000px){.pipe{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;border:2px solid transparent}
.st-neu{background:#ffffff;border-color:#9a9a90}.st-angerufen{background:#d9d9d0;border-color:#9a9a90}.st-termin{background:#eaffa3;border-color:#7f9a1f}.st-unterschrieben{background:#c8ff00;border-color:#4a6600}.st-abgeschlossen{background:#4a6600;border-color:#4a6600}.st-verloren{background:#f6c9c2;border-color:#b42318}
.slab{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.funnel{display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:14px}
.frow .fb{height:22px;background:var(--panel2);border-radius:6px;overflow:hidden}.frow .fb>div{height:100%;background:var(--lime);border-radius:6px;min-width:2px}
.frow .fv{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
@media (max-width:520px){.frow{grid-template-columns:minmax(0,1fr) 80px}.frow .fb{grid-column:1/-1;grid-row:2}}
.dlist{display:flex;flex-direction:column}
.ditem{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding:10px 0;min-height:44px;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;color:var(--fg);width:100%}
.ditem:hover{background:var(--panel2)}
.ditem .dn{flex:1 1 180px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.ditem .dd{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ditem .dd.late,.eyebrow.late{color:#b42318;font-weight:600}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.ctable{width:100%;border-collapse:collapse;font-size:14px}
.ctable th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-strong)}
.ctable td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ctable tr.clk{cursor:pointer}.ctable tr.clk:hover td{background:var(--panel2)}
.ctable .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:760px){.ctable thead{display:none}.ctable tr{display:grid;grid-template-columns:minmax(0,1fr) auto;border-bottom:1px solid var(--line);padding:8px 0}.ctable td{border:0;padding:3px 4px}.ctable td.hide-m{display:none}}
.m-only{display:none}
@media (max-width:760px){.m-only{display:inline;color:var(--muted);font-size:12px}}
.log{display:flex;flex-direction:column;gap:8px}
.logi{border-left:3px solid var(--lime);padding:4px 0 4px 12px;font-size:14px}
.logi .lm{font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:8px 0;min-height:44px;color:var(--accent-ink);font-weight:600;cursor:pointer;text-align:left;align-self:flex-start;text-decoration:underline;text-underline-offset:3px}
.member{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.member .who{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--panel2);color:var(--muted);margin-left:8px}
.tag.lime{background:var(--lime);color:var(--lime-ink)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff1ef;border:1px solid #f1b8b0;border-radius:12px;padding:10px 12px}
@media (max-width:1319px){.stage .t{font-size:15px}}
@media (max-width:1149px){.stages{grid-template-columns:repeat(6,minmax(0,1fr))}.stages>li{grid-column:span 2}.stages>li:nth-child(4),.stages>li:nth-child(5){grid-column:span 3}.stage .t{font-size:17px}}
@media (max-width:599px){.stages{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stages>li,.stages>li:nth-child(4),.stages>li:nth-child(5){grid-column:auto}.stages>li:last-child:nth-child(odd){grid-column:1/-1}.stage{min-height:150px;padding:14px}.stage .t{font-size:16px}.prog-parts{grid-template-columns:minmax(0,1fr)}.prog-pct{font-size:28px}}
.mobile-back{display:none}
@media (max-width:860px){
  .split{grid-template-columns:minmax(0,1fr)}.paper{max-height:none}
  .app{flex-direction:column;flex-wrap:nowrap}
  .side{max-width:none;flex:none;border-right:0;border-bottom:1px solid var(--line);padding-block:14px;gap:12px}
  .brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand img{width:112px}.brand .prod{margin-top:0;font-size:14px}
  .side .label{display:none}
  #flowNav{display:none!important}
  #custList{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  #custList .navbtn{width:auto;flex:none;white-space:nowrap;padding:8px 14px}
  #custList .navbtn small{display:inline;margin-left:6px}
  .side .group.settings{flex-direction:row;flex-wrap:wrap;gap:6px}
  .side .group.settings .navbtn{width:auto;min-height:44px;padding:8px 12px;font-size:14px}
  .mobile-back{display:inline-flex;align-items:center;align-self:flex-start}
  .main{padding-block:18px 40px}
}
@media (max-width:860px){.toast{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form class="card login-card" id="loginForm">
    <img src="logo-black.png" alt="ONLION" style="width:170px">
    <div class="eyebrow" style="color:var(--accent-ink);font-weight:600">KI-Telefon-Agent · Onboarding</div>
    <div class="field"><label for="lg-mail">E-Mail</label><input type="email" id="lg-mail" autocomplete="username" required></div>
    <div class="field"><label for="lg-pw">Passwort</label><input type="password" id="lg-pw" autocomplete="current-password" required></div>
    <div id="lg-err" class="banner warn" hidden></div>
    <button class="btn primary" type="submit" id="lg-btn">Anmelden</button>
    <button class="linkbtn" type="button" id="lg-forgot">Passwort vergessen?</button>
  </form>
  <form class="card login-card" id="pwForm" hidden>
    <img src="logo-black.png" alt="ONLION" style="width:170px">
    <h2 id="pw-title">Passwort festlegen</h2>
    <div class="eyebrow" id="pw-who"></div>
    <div class="field"><label for="pw-new">Neues Passwort</label><input type="password" id="pw-new" autocomplete="new-password" required></div>
    <div class="field"><label for="pw-rep">Passwort wiederholen</label><input type="password" id="pw-rep" autocomplete="new-password" required></div>
    <div class="eyebrow">Mindestens 10 Zeichen.</div>
    <div id="pw-err" class="banner warn" hidden></div>
    <button class="btn primary" type="submit" id="pw-btn">Speichern und weiter</button>
  </form>
</div>
<div class="app">
  <nav class="side" aria-label="Navigation">
    <a class="brand" id="homeLink" href="#" aria-label="ONLION – zur Startseite (Dashboard)"><img src="logo-black.png" alt="ONLION"><div class="prod" id="prodName">KI-Telefon-Agent</div></a>
    <div class="group settings" id="dashGroup">
      <div class="label">Überblick</div>
      <button class="navbtn" id="navDash" type="button">Dashboard</button>
      <button class="navbtn" id="navVertrieb" type="button" hidden>Vertrieb</button>
    </div>
    <div class="group" id="custGroup">
      <div class="label">Kunden</div>
      <div id="custList"></div>
      <div id="newCustBox"></div>
    </div>
    <div class="group" id="flowNav" hidden>
      <div class="label">Ablauf</div>

<script>
(function(){
const TPL_ID='ki-telefon-agent', LEGAL_ID='ki-telefon-agent';
const STAGES=[
  {id:'fragen',t:'Fragenkatalog'},
  {id:'datenschutz',t:'Datenschutz & AVV'},
  {id:'unterschrift',t:'Unterschrift'},
  {id:'pdf',t:'PDF'},
  {id:'angebot',t:'Angebot'}
];
const STORAGE_OPTS=['Nur als Text, 90 Tage','Audio und Text, 30 Tage','Nicht speichern'];
const SETTINGS=['vorlagen','konto','dashboard','vertrieb'];
const CRM=[
  {id:'neu',t:'Neu'},
  {id:'angerufen',t:'Angerufen'},
  {id:'termin',t:'Termin vereinbart'},
  {id:'unterschrieben',t:'Unterschrieben'},
  {id:'abgeschlossen',t:'Abgeschlossen'},
  {id:'verloren',t:'Verloren'}
];
const CRM_RANK={neu:0,angerufen:1,termin:2,unterschrieben:3,abgeschlossen:4};
const QUELLEN=['Empfehlung','Event','Kaltakquise','Website','Social Media','Bestandskunde','Sonstiges'];
const S={me:null,team:[],blocked:false,leadsales:[],prov:[],zahl:[],gs:[],vorschl:[],cfg:null,struct:[],db:null,dl:null,customers:[],tpl:null,legal:null,curId:null,view:'start',section:0,newOpen:false,loaded:false,pendingRender:false,confirm:null,pads:{}};

function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k]; if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(k==='value')el.value=v;
    else if(k==='checked')el.checked=!!v;
    else if(k==='disabled')el.disabled=!!v;
    else el.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat()){ if(c==null||c===false)continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}
function cur(){return S.customers.find(c=>c.id===S.curId)||null;}
function allQs(){return S.tpl?S.tpl.sections.flatMap(s=>s.questions):[];}
/* Echte Antwort: mind. 3 Zeichen, kein Platzhalter wie „.“, „x“, „-“, „???“, „aaa“ */
const LEAD_TEXT_DEFAULT='Ich bin einverstanden, dass ONLION die Kontaktdaten meines Unternehmens (Firma, Branche, Anschrift, Ansprechpartner, E-Mail, Telefon) an Unternehmen aus den Bereichen Telekommunikation, IT und Software, Marketing sowie Unternehmensberatung weitergibt, die mir Angebote für mein Unternehmen per E-Mail und Telefon machen dürfen. Die aktuelle Liste der Empfänger stellt ONLION auf Anfrage zur Verfügung. Die Einwilligung ist freiwillig und unabhängig vom Vertrag über den KI-Telefon-Agenten. Ich kann sie jederzeit ohne Angabe von Gründen gegenüber ONLION widerrufen; die Weitergabe endet dann für die Zukunft.';
function leadText(){return (S.cfg&&S.cfg.leadText)||LEAD_TEXT_DEFAULT;}
function leadOk(c){const l=c&&c.leadConsent;return !!(l&&l.given&&!l.widerrufenAm);}
function realAnswer(v){const s=String(v||'').trim();if(!s)return false;
  if(/^\d+([.,]\d+)?\s*[%€a-zA-ZäöüÄÖÜ.\/-]{0,12}$/.test(s))return true;                 // Zahlen: „5“, „50“, „100 %“, „3 Std.“
  if(/^(ja|nein|jo|nö|ok|okay)\.?!?$/i.test(s))return true;                                 // kurze Ja/Nein-Antworten
  if(/^[\s.,;:!?\-_xX\/\\*+#~|]+$/.test(s))return false;                                   // nur Platzhalterzeichen
  const t=s.replace(/\s/g,'').toLowerCase();
  if(/^([.\-_x?*])\1*$/.test(t))return false;
  if(/^(n\/?a|test|asdf|qwer|xyz|bla|blabla)$/.test(t))return false;
  return /[a-zA-ZäöüÄÖÜß]/.test(s)&&s.length>=2;}
function isNA(c,q){return !q.star&&!!(c.na&&c.na[q.id]);}
function answered(c,q){return realAnswer((c.answers||{})[q.id])||isNA(c,q);}
function answeredCount(c){return allQs().filter(q=>answered(c,q)).length;}
function missingQs(c){return allQs().filter(q=>!answered(c,q));}
function legalOk(c){const l=c.legal||{};return !!(l.dsb&&l.speicherung&&l.hinweis&&l.agb);}
function signed(c){return !!(c&&c.signature&&c.signature.hash);}
/* CRM: gespeicherter Status; „Unterschrieben“ ergibt sich automatisch aus der Unterschrift */
function crmOf(c){return (c&&c.crm)||{};}
function stat(c){const b=crmOf(c).status||'neu';if(signed(c)&&b!=='verloren'&&(CRM_RANK[b]||0)<CRM_RANK.unterschrieben)return 'unterschrieben';return b;}
function statT(id){const x=CRM.find(s=>s.id===id);return x?x.t:id;}
function statEl(id){return h('span',{class:'slab'},h('span',{class:'sdot st-'+id,'aria-hidden':'true'}),statT(id));}
function reached(c){let r=CRM_RANK[stat(c)]||0;for(const e of (crmOf(c).history||[]))r=Math.max(r,CRM_RANK[e.s]||0);if(signed(c)||(c.history||[]).length)r=Math.max(r,CRM_RANK.unterschrieben);return r;}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDay(s){if(!s)return '';try{const d=new Date(s.length<=10?s+'T12:00':s);return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})+(s.length>10?', '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'');}catch(e){return s;}}
function crmPatch(c,status){
  const cr=crmOf(cur()&&cur().id===c.id?cur():c);const hist=(cr.history||[]).concat([{s:status,at:new Date().toISOString(),by:(S.me&&S.me.email)||''}]);
  return {crm:{status,history:hist}};
}
const STAMM=[['firma','Firma'],['ansprechpartner','Ansprechpartner'],['email','E-Mail'],['telefon','Telefon'],['adresse','Adresse']];
const STAMM_KEYS=['firma','ansprechpartner','email','telefon','adresse','branche'];
function normWeb(v){v=String(v||'').trim();if(!v)return '';if(!/^https?:\/\//i.test(v))v='https://'+v;try{const u=new URL(v);return u.hostname.includes('.')?u.origin+(u.pathname==='/'?'':u.pathname):'';}catch(e){return '';}}
function webHost(v){try{return new URL(v).hostname.replace(/^www\./,'');}catch(e){return v;}}
const STAMM_LABEL={firma:'Firma',ansprechpartner:'Ansprechpartner',email:'E-Mail',telefon:'Telefon',adresse:'Adresse',branche:'Branche'};
const LEGAL_REQ=['dsb','speicherung','hinweis','agb'];
function progress(c){
  const l=c.legal||{},qs=allQs(),has=q=>answered(c,q);
  const stars=qs.filter(q=>q.star);
  const qDone=qs.filter(has).length,sDone=stars.filter(has).length;
  const stDone=STAMM.filter(([k])=>(c[k]||'').trim()).length,lDone=LEGAL_REQ.filter(k=>!!l[k]).length;
  const total=qs.length+STAMM.length+LEGAL_REQ.length,done=qDone+stDone+lDone;
  return {qDone,qTotal:qs.length,sDone,sTotal:stars.length,stDone,stTotal:STAMM.length,lDone,lTotal:LEGAL_REQ.length,done,total,pct:total?Math.round(done/total*100):0,openStars:stars.filter(q=>!has(q)).map(q=>qs.indexOf(q)+1)};
}
function fillProgress(box,c,compact){
  const p=progress(c);
  if(compact){
    box.setAttribute('aria-label','Gesprächsfortschritt '+p.pct+' Prozent');
    box.replaceChildren(h('span',null,'Gespräch gesamt'),h('div',{class:'pbar','aria-hidden':'true'},h('div',{style:'width:'+p.pct+'%'})),h('span',{class:'tabnum',style:'font-weight:700;color:var(--fg)'},p.pct+' %'));
    return;
  }
  const part=(label,n,m,view,extra)=>h('button',{type:'button',class:'part',onclick:()=>{S.view=view;render();window.scrollTo(0,0);}},h('span',{class:'pl'},label),h('div',{class:'pbar','aria-hidden':'true'},h('div',{style:'width:'+(m?Math.round(n/m*100):0)+'%'})),h('span',{class:'pn'},n+' von '+m+(extra||'')));
  box.replaceChildren(
    h('div',{class:'prog-head'},h('h2',null,'Gesprächsfortschritt'),h('div',{class:'spacer'}),h('span',{class:'eyebrow tabnum'},p.done+' von '+p.total+' Punkten erfasst'),h('span',{class:'prog-pct'},p.pct+' %')),
    h('div',{class:'pbar',role:'progressbar','aria-valuemin':'0','aria-valuemax':'100','aria-valuenow':String(p.pct),'aria-label':'Gesprächsfortschritt'},h('div',{style:'width:'+p.pct+'%'})),
    h('div',{class:'prog-parts'},
      part('Stammdaten',p.stDone,p.stTotal,'start'),
      part('Fragenkatalog',p.qDone,p.qTotal,'fragen',' · ★ '+p.sDone+' von '+p.sTotal),
      part('Datenschutz',p.lDone,p.lTotal,'datenschutz')),
    h('div',{class:'eyebrow'},p.openStars.length?'Noch offen mit ★: Frage '+p.openStars.join(', '):'Alle ★-Fragen sind beantwortet.'));
}
function progressEl(c,compact){const box=h('div',{class:compact?'prog-mini':'card prog'});(S.progEls=S.progEls||[]).push({box,compact,id:c.id});fillProgress(box,c,compact);return box;}
function updateProgress(){const c=cur();if(!c||!S.progEls)return;for(const e of S.progEls)if(e.id===c.id)fillProgress(e.box,c,e.compact);}

function stageState(c,id){
  const total=allQs().length,n=answeredCount(c);
  if(id==='fragen')return total&&n===total?'done':(n?'now':'open');
  if(id==='datenschutz')return legalOk(c)?'done':((c.legal&&Object.keys(c.legal).length)?'now':'open');
  if(id==='unterschrift')return signed(c)?'done':'open';
  if(id==='pdf')return c.pdfAt?'done':'open';
  return (c.offer&&c.offer.items&&c.offer.items.length)?'done':'open';
}
function fmtDate(iso){try{return new Date(iso).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'});}catch(e){return iso;}}
function fill(text,c){
  if(signed(c)&&c.signature.stamm)c=Object.assign({},c,c.signature.stamm); // unterschriebene Fassung
  let l=c.legal||{}; const today=(signed(c)?new Date(c.signature.signedAt):new Date()).toLocaleDateString('de-DE');
  const T=v=>String(v||'').replace(/\s+/g,' ').trim();c=Object.assign({},c,{firma:T(c.firma),adresse:T(c.adresse),ansprechpartner:T(c.ansprechpartner)});l=Object.assign({},l,{dsb:T(l.dsb),speicherung:T(l.speicherung)});
  const map={firma:c.firma||'[Firma]',adresse:c.adresse||'[Adresse]',vertreter:c.ansprechpartner||'[Ansprechpartner]',dsb:l.dsb||'[Datenschutzbeauftragter]',speicherung:l.speicherung||'[Speicherung]',datum:today};
  return String(text||'').replace(/\{\{\s*(\w+)\s*\}\}/g,(m,k)=>k in map?map[k]:m);
}

/* ---------- writes ---------- */
const timers={};
/* Listen im CRM werden beim Speichern mit dem Stand in der Datenbank vereinigt, damit
   gleichzeitige Einträge mehrerer Team-Mitglieder nicht verloren gehen. */
function unionBy(a,b,key){const m=new Map();for(const x of (a||[]).concat(b||[]))m.set(key(x),x);return [...m.values()];}
function mergeCrm(curCrm,pCrm){
  const out={};
  if(pCrm.log)out.log=unionBy(curCrm.log,pCrm.log,e=>e.id||(e.at+'|'+e.by+'|'+e.text)).sort((x,y)=>String(y.at).localeCompare(String(x.at)));
  if(pCrm.history)out.history=unionBy(curCrm.history,pCrm.history,e=>e.at+'|'+e.by+'|'+e.s).sort((x,y)=>String(x.at).localeCompare(String(y.at)));
  if(pCrm.logDel)out.logDel=unionBy(curCrm.logDel,pCrm.logDel,k=>k);
  if(out.history&&out.history.length&&pCrm.status)out.status=out.history[out.history.length-1].s;
  return out;
}
function deepMerge(t,p){for(const k in p){const v=p[k];if(v&&typeof v==='object'&&!Array.isArray(v)){if(!t[k]||typeof t[k]!=='object')t[k]={};deepMerge(t[k],v);}else t[k]=v;}return t;}
function saveCust(id,patch,delay){
  if(!S.db)return;
  const top=Object.keys(patch)[0],sub=patch[top]&&typeof patch[top]==='object'?Object.keys(patch[top])[0]:'';
  const key=id+'|'+top+'|'+sub;
  const local=S.customers.find(c=>c.id===id);if(local)deepMerge(local,JSON.parse(JSON.stringify(patch)));updateProgress();
  if(timers[key])clearTimeout(timers[key].t);
  const run=()=>{delete timers[key];return S.db.doc('customers/'+id).update(Object.assign({updatedAt:new Date().toISOString()},patch)).catch(e=>toast('Nicht gespeichert: '+(e&&e.message||e)));};
  timers[key]={t:setTimeout(run,delay==null?500:delay),run};
}
function flushAll(){const ps=[];for(const k in timers){clearTimeout(timers[k].t);ps.push(timers[k].run());}return Promise.all(ps);}
async function createCustomer(data){
  const now=new Date().toISOString();
  const ref=S.db.collection('customers').doc();
  await ref.set(Object.assign({product:'KI-Telefon-Agent',templateId:TPL_ID,answers:{},legal:{},crm:{status:'neu',history:[{s:'neu',at:now,by:(S.me&&S.me.email)||''}]},createdAt:now,updatedAt:now},(S.me&&S.me.role==='partner')?{partner:S.me.email}:{},data));
  S.curId=ref.id;S.view='start';S.newOpen=false;render();
  return ref.id;
}

/* ---------- sidebar ---------- */
function renderSide(){
  const list=document.getElementById('custList');list.replaceChildren();
  if(!S.loaded)list.append(h('div',{class:'eyebrow',text:'Lade Kunden …'}));
  for(const c of S.customers){
    list.append(h('button',{type:'button',class:'navbtn'+(c.id===S.curId&&!SETTINGS.includes(S.view)?' on':''),onclick:()=>{S.curId=c.id;S.view='start';render();}},c.firma||'Ohne Namen',h('small',null,statT(stat(c))+(stat(c)==='neu'||stat(c)==='angerufen'||stat(c)==='termin'?' · '+progress(c).pct+' % erfasst':''))));
  }
  const nb=document.getElementById('newCustBox');nb.replaceChildren();
  if(!S.db){nb.append(h('div',{class:'eyebrow',text:'Speichern ist in dieser Ansicht nicht verfügbar.'}));}
  else if(!S.newOpen){nb.append(h('button',{type:'button',class:'btn ghost-dashed',onclick:()=>{S.newOpen=true;renderSide();setTimeout(()=>{const f=document.getElementById('nc-firma');f&&f.focus();},0);}},'+ Neuer Kunde'));}
  else{
    const form=h('form',{class:'card',style:'padding:14px;gap:10px',onsubmit:async e=>{e.preventDefault();const v=document.getElementById('nc-firma').value.trim(),w=normWeb(document.getElementById('nc-web').value);
        if(!v&&!w){toast('Bitte Firma oder Webseite eintragen.');return;}
        const id=await createCustomer(Object.assign({firma:v||webHost(w)},w?{webseite:w}:{}));
        if(w&&id)runResearch({id,webseite:w});}},
      h('div',{class:'field'},h('label',{for:'nc-firma'},'Firma'),h('input',{type:'text',id:'nc-firma',autocomplete:'organization'})),
      h('div',{class:'field'},h('label',{for:'nc-web'},'Webseite (optional, für die Recherche)'),h('input',{type:'text',id:'nc-web',inputmode:'url',autocapitalize:'off',spellcheck:'false',placeholder:'www.beispiel.de',autocomplete:'url'})),
      h('div',{class:'row'},h('button',{type:'submit',class:'btn primary'},'Anlegen'),h('button',{type:'button',class:'btn',onclick:()=>{S.newOpen=false;renderSide();}},'Abbrechen')));
    nb.append(form);
  }
  const fn=document.getElementById('flowNav'),fl=document.getElementById('flowList'),c=cur();
  fn.hidden=!c||SETTINGS.includes(S.view)||S.blocked;fl.replaceChildren();
  if(c&&!SETTINGS.includes(S.view)&&!S.blocked){
    fl.append(h('button',{type:'button',class:'navbtn'+(S.view==='start'?' on':''),onclick:()=>{S.view='start';render();}},'Übersicht'));
    STAGES.forEach((st,i)=>{
      const state=stageState(c,st.id);
      fl.append(h('button',{type:'button',class:'navbtn'+(S.view===st.id?' on':''),disabled:state==='locked',onclick:()=>{S.view=st.id;render();}},h('span',{class:'step'},h('span',{class:'dot '+(state==='done'?'done':state==='now'?'now':'')}),(i+1)+' · '+st.t)));
    });
  }
  document.getElementById('navTpl').className='navbtn'+(S.view==='vorlagen'?' on':'');
  document.getElementById('navKonto').className='navbtn'+(S.view==='konto'?' on':'');
  document.getElementById('navDash').className='navbtn'+(S.view==='dashboard'?' on':'');document.getElementById('dashGroup').hidden=S.blocked;
  document.getElementById('custGroup').hidden=S.blocked;
  document.getElementById('navTpl').hidden=S.blocked||!isAdmin();document.getElementById('navKonto').hidden=S.blocked;
  const nv=document.getElementById('navVertrieb');nv.hidden=S.blocked||!S.me;nv.textContent=isAdmin()?'Vertrieb':'Provisionen';nv.className='navbtn'+(S.view==='vertrieb'?' on':'');
}

function lockedBanner(c){return signed(c)?h('div',{class:'banner ok'},'Unterschrieben am '+fmtDate(c.signature.signedAt)+'. Änderungen sind gesperrt. Zum Ändern unter „Unterschrift“ eine neue Version starten.'):null;}

function viewStart(c){
  const stages=h('ol',{class:'stages','aria-label':'Ablauf',lang:'de'});
  STAGES.forEach((st,i)=>{
    const state=stageState(c,st.id);
    let d='';
    if(st.id==='fragen')d=answeredCount(c)+' von '+allQs().length+' Fragen beantwortet';
    if(st.id==='datenschutz')d=legalOk(c)?'Angaben vollständig':'Speicherdauer, Hosting, Ansprechpartner';
    if(st.id==='unterschrift')d=signed(c)?'Am '+fmtDate(c.signature.signedAt)+(progress(c).pct<100?' · mit offenen Punkten':''):'Direkt auf dem iPad, mit Zeitstempel';
    if(st.id==='pdf')d=c.pdfAt?'Erstellt am '+fmtDate(c.pdfAt):'Zusammenfassung als PDF speichern';
    if(st.id==='angebot'){const it=(c.offer&&c.offer.items)||[];d=it.length?it.length+' Position(en) · '+eur(offerTotals(it).net)+' netto':'Positionen und Summen kalkulieren';}
    const k=String(i+1).padStart(2,'0')+' · '+(state==='done'?'ERLEDIGT':state==='now'?'IN ARBEIT':state==='locked'?'BALD':'OFFEN');
    stages.append(h('li',null,h('button',{type:'button',class:'stage '+state,disabled:state==='locked',onclick:()=>{S.view=st.id;render();}},h('span',{class:'k'},k),h('span',{class:'t'},st.t),h('span',{class:'d'},d))));
  });
  const sgS=signed(c)?(c.signature.stamm||null):null;
  const ensureSnap=()=>{if(signed(c)&&!c.signature.stamm){const snap={};for(const k of STAMM_KEYS)snap[k]=c[k]||'';c.signature.stamm=snap;saveCust(c.id,{signature:{stamm:snap}},0);}};
  const f=(id,label,key,type)=>h('div',{class:'field'},h('label',{for:id},label),h('input',{type:type||'text',id,value:c[key]||'',onfocus:ensureSnap,oninput:e=>{ensureSnap();const p={};p[key]=e.target.value;saveCust(c.id,p);},onchange:e=>{const v=e.target.value.replace(/\s+/g,' ').trim();if(v!==e.target.value){e.target.value=v;const p={};p[key]=v;saveCust(c.id,p);}}}));
  const changed=sgS?STAMM_KEYS.filter(k=>k!=='branche'&&String(sgS[k]||'').trim()!==String(c[k]||'').trim()):[];
  const stamm=h('section',{class:'card','aria-label':'Stammdaten'},h('h2',null,'Stammdaten'),

function blobToBase64(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob);});}
async function callFn(name,payload){
  if(!S.sb)throw new Error('Nur in der eigenständigen App verfügbar.');
  const {data:{session}}=await S.sb.auth.getSession();
  const r=await fetch('/.netlify/functions/'+name,{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+(session&&session.access_token||'')},body:JSON.stringify(payload)});
  const t=await r.json().catch(()=>({}));
  if(r.status===413)throw new Error('Die Datei ist zu groß für den Versand.');
  if(!r.ok)throw new Error(t.error||('Fehler '+r.status));
  return t;
}

async function runResearch(c){
  const url=c.webseite;if(!url)return;
  S.research[c.id]={busy:true,step:'Webseite wird gelesen …'};render._force=true;render();
  try{
    const f=await callFn('research',{step:'fetch',url,customerId:c.id});
    S.research[c.id]={busy:true,step:'KI wertet aus …'};render._force=true;render();
    const qs=allQs().map(q=>({id:q.id,text:q.text}));const st=cfg().staffeln.map(x=>({id:x.id,label:x.label}));
    const base={step:'analyze',url:f.url,customerId:c.id,pages:f.pages,exp:f.exp,sig:f.sig};
    // drei kurze Auswertungen parallel, damit keine das Zeitlimit reißt
    const parts=await Promise.allSettled([callFn('research',Object.assign({part:'a',staffeln:st},base)),callFn('research',Object.assign({part:'b',questions:qs},base)),callFn('research',Object.assign({part:'c'},base))]);
    const okParts=parts.filter(p=>p.status==='fulfilled');
    if(!okParts.length)throw parts[0].reason||new Error('Auswertung fehlgeschlagen.');

const REC_MAX=180;
function recSupported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);}
async function recStart(c){
  if(!recSupported()){toast('Aufnahme wird von diesem Browser nicht unterstützt.');return;}
  if(S.rec){toast('Es läuft bereits eine Aufnahme.');return;}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast('Kein Zugriff auf das Mikrofon. Bitte in den Einstellungen erlauben.');return;}
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac'].find(t=>{try{return MediaRecorder.isTypeSupported(t);}catch(e){return false;}})||'';
  const mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);const chunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  const rec={cid:c.id,mr,stream,start:Date.now(),timer:null};S.rec=rec;
  mr.onstop=()=>{clearInterval(rec.timer);stream.getTracks().forEach(t=>t.stop());const type=(mr.mimeType||mime||'audio/webm').split(';')[0];const blob=new Blob(chunks,{type});const secs=Math.round((Date.now()-rec.start)/1000);S.rec=null;render._force=true;render();if(blob.size<200){toast('Aufnahme zu kurz.');return;}recSave(c,blob,type,secs);};

}

/* ---------- Supabase-Anbindung ---------- */
function makeDb(sb){
  const listeners=new Set(),queues=new Map();
  const enqueue=(key,fn)=>{const p=(queues.get(key)||Promise.resolve()).then(fn,fn);queues.set(key,p.catch(()=>{}));return p;};
  const snap=(id,d)=>({id,exists:!!d,data:()=>d||undefined});
  async function fetchDoc(col,id){const {data,error}=await sb.from('docs').select('data').eq('collection',col).eq('id',id).maybeSingle();if(error)throw error;return data?data.data:null;}
  async function fetchCol(col){const {data,error}=await sb.from('docs').select('id,data').eq('collection',col);if(error)throw error;return data||[];}
  async function emit(l){
    try{
      if(l.type==='doc'){l.cb(snap(l.id,await fetchDoc(l.col,l.id)));return;}
      const rows=await fetchCol(l.col);
      if(l.order){const [f,dir]=l.order;rows.sort((a,b)=>{const x=a.data[f]||'',y=b.data[f]||'';return (x<y?-1:x>y?1:0)*(dir==='desc'?-1:1);});}
      l.cb({docs:rows.map(r=>snap(r.id,r.data))});
    }catch(e){l.err&&l.err(e);}
  }
  const notify=col=>{for(const l of listeners)if(l.col===col)emit(l);};
  sb.channel('docs-changes').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{const col=(p.new&&p.new.collection)||(p.old&&p.old.collection);if(col)notify(col);else for(const l of listeners)emit(l);}).subscribe();
  async function fetchRow(col,id){const {data,error}=await sb.from('docs').select('data,updated_at').eq('collection',col).eq('id',id).maybeSingle();if(error)throw error;return data||null;}
  async function writeIf(col,id,data,stamp){let q=sb.from('docs').update({data,updated_at:new Date().toISOString()}).eq('collection',col).eq('id',id);q=stamp==null?q.is('updated_at',null):q.eq('updated_at',stamp);const {data:rows,error}=await q.select('id');if(error)throw error;return !!(rows&&rows.length);}
  async function write(col,id,data){const {error}=await sb.from('docs').upsert({collection:col,id,data,updated_at:new Date().toISOString()});if(error)throw error;}
  function doc(path){
    const [col,id]=path.split('/');const key=col+'/'+id;
    return {id,
      get:async()=>snap(id,await fetchDoc(col,id)),
      set:d=>enqueue(key,async()=>{await write(col,id,d);notify(col);}),
      update:p=>enqueue(key,async()=>{
        // Lesen, zusammenführen, nur schreiben, wenn niemand dazwischen gespeichert hat (sonst bis zu 4 Versuche)
        for(let i=0;i<4;i++){
          const row=await fetchRow(col,id);if(!row)throw new Error('Datensatz nicht gefunden');const cur=row.data;
          const pp=JSON.parse(JSON.stringify(p));if(pp.crm&&typeof pp.crm==='object')Object.assign(pp.crm,mergeCrm((cur.crm)||{},pp.crm));
          if(await writeIf(col,id,deepMerge(JSON.parse(JSON.stringify(cur)),pp),row.updated_at)){notify(col);return;}
          await new Promise(r=>setTimeout(r,80+Math.random()*200));
        }
        throw new Error('Gleichzeitige Änderung, bitte erneut speichern.');
      }),
      delete:()=>enqueue(key,async()=>{const {error}=await sb.from('docs').delete().eq('collection',col).eq('id',id);if(error)throw error;notify(col);}),
      onSnapshot(cb,err){const l={type:'doc',col,id,cb,err};listeners.add(l);emit(l);return()=>listeners.delete(l);}
    };
  }
  function collection(col){
    const q={_order:null,
      orderBy(f,dir){q._order=[f,dir||'asc'];return q;},
      doc(id){return doc(col+'/'+(id||crypto.randomUUID()));},
      onSnapshot(cb,err){const l={type:'col',col,cb,err,order:q._order};listeners.add(l);emit(l);return()=>listeners.delete(l);}
    };
    return q;
  }
  async function bulk(col,list){if(!list||!list.length)return;const now=new Date().toISOString();for(let i=0;i<list.length;i+=200){const {error}=await sb.from('docs').upsert(list.slice(i,i+200).map(d=>({collection:col,id:d.id,data:d,updated_at:now})));if(error)throw error;}notify(col);}
  return {doc,collection,bulk};
}

function loginFlow(sb){

    const box=document.getElementById('login'),form=document.getElementById('loginForm'),err=document.getElementById('lg-err'),btn=document.getElementById('lg-btn');

function setPasswordFlow(sb,session,kind){

(async function boot(){
  const cfg=window.ONLION_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl||/DEIN-PROJEKT/.test(cfg.supabaseUrl)){S.loaded=true;render();showSetup();return;}
  // Links aus Einladungs- und Passwort-E-Mails kommen mit #access_token=…&type=invite|recovery an
  const hp=new URLSearchParams(location.hash.replace(/^#/,''));
  const linkType=hp.get('type'),linkErr=hp.get('error_description')||hp.get('error');
  const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  document.getElementById('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.reload();});
  let {data:{session}}=await sb.auth.getSession();
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
  if(linkErr&&!session)loginFlow.notice='Der Link ist abgelaufen oder wurde schon benutzt. Bitte E-Mail eintragen und „Passwort vergessen?“ wählen.';
  // Merkzeichen: Wer über einen Link kommt, muss erst ein Passwort festlegen – auch nach einem Neuladen
  let pending=null;try{if(session&&(linkType==='invite'||linkType==='recovery'))localStorage.setItem('onlion_pw_pending',linkType);pending=localStorage.getItem('onlion_pw_pending');}catch(x){pending=session?linkType:null;}
  if(!session){try{localStorage.removeItem('onlion_pw_pending');}catch(x){}session=await loginFlow(sb);}
  else if(pending==='invite'||pending==='recovery')await setPasswordFlow(sb,session,pending);
  S.sb=sb;
  const myMail=String(session&&session.user&&session.user.email||'').toLowerCase();
  try{await loadTeam();}catch(e){S.team=[];S.teamError=true;}
  const meRow=S.team.find(m=>String(m.email).toLowerCase()===myMail);
  S.me={email:myMail,role:meRow?meRow.role:'member'};
  // Team-Liste noch nicht eingerichtet: App läuft weiter, den Datenschutz übernimmt die Datenbank-Policy
  if((!meRow&&!S.teamError)||(meRow&&meRow.role==='partner'&&meRow.status==='inaktiv')){S.blocked=true;S.loaded=true;render();return;}
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.reload();});
  const db=makeDb(sb);
  S.db=db;S.dl=browserDownloads;
  // Vertrieb: Modell, Provisionen, Gutschriften, Vorschläge (Zahlungen nur ONLION)
  const sub=(col,key)=>db.collection(col).onSnapshot(snap=>{S[key]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(S.view==='vertrieb'||S.view==='start'){const a=document.activeElement;if(!(a&&a.closest&&a.closest('#view')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))render();}},()=>{});
  db.doc('config/provision').onSnapshot(sn=>{S.cfg=sn.exists?sn.data():null;},()=>{});
  if(isAdmin())db.doc('intern/kosten').onSnapshot(sn=>{S.kosten=sn.exists?sn.data():null;},()=>{});
  sub('provisionen','prov');sub('gutschriften','gs');sub('vorschlaege','vorschl');
  if(isAdmin()){sub('zahlungen','zahl');sub('leadverkaeufe','leadsales');}
  else sb.rpc('my_structure').then(({data})=>{S.struct=data||[];});
  db.collection('customers').orderBy('createdAt','desc').onSnapshot(snap=>{
    S.customers=snap.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded=true;
    if(!S.curId&&S.customers.length)S.curId=S.customers[0].id;
    if(S.view==='datenschutz'&&S._drawPreview){S._drawPreview();}
    if(S.view==='unterschrift'&&!signed(cur())){renderSide();return;}
    render();
  },e=>{S.loaded=true;toast('Kunden konnten nicht geladen werden.');render();});
  db.doc('templates/'+TPL_ID).onSnapshot(s=>{
    const a=document.activeElement;if(S.view==='vorlagen'&&a&&a.closest&&a.closest('#view'))return;
    S.tpl=s.exists?JSON.parse(JSON.stringify(s.data())):null;
    if(S.tpl&&JSON.stringify(S.tpl).includes('mehr Finanzierungs-Leads?')){S.tpl=JSON.parse(JSON.stringify(S.tpl).split('mehr Finanzierungs-Leads?').join('mehr Käufer- und Verkäufer-Leads?'));db.doc('templates/'+TPL_ID).set(S.tpl).catch(()=>{});}
    if(S.tpl&&S.tpl.name)document.getElementById('prodName').textContent=S.tpl.product||'KI-Telefon-Agent';
    if(S.view==='unterschrift'&&!signed(cur())){renderSide();return;}render();});
  db.doc('legal/'+LEGAL_ID).onSnapshot(s=>{
    const a=document.activeElement;if(S.view==='vorlagen'&&a&&a.closest&&a.closest('#view'))return;
    S.legal=s.exists?JSON.parse(JSON.stringify(s.data())):null;if(S.legal&&JSON.stringify(S.legal).includes('fragt er, ob')){S.legal=JSON.parse(JSON.stringify(S.legal).split('fragt er, ob').join('fragt der Assistent, ob'));db.doc('legal/'+LEGAL_ID).set(S.legal).catch(()=>{});}if(S.view==='datenschutz'&&S._drawPreview)S._drawPreview();else if(S.view==='unterschrift'&&!signed(cur()))renderSide();else render();});
})();
})();
</script>
</body>
</html>
